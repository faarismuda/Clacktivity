name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: pytest -v

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --noconsole `
            --name KeyboardAnalytics `
            --add-data "static;static" `
            --hidden-import pystray._win32 `
            --collect-submodules uvicorn `
            run.py

      - name: Package portable ZIP archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/KeyboardAnalytics.exe dist/package/
          Copy-Item README.md dist/package/
          Copy-Item LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/KeyboardAnalytics-windows-x64.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardAnalytics-windows-x64
          path: |
            dist/KeyboardAnalytics.exe
            dist/KeyboardAnalytics-windows-x64.zip

      - name: Publish GitHub Release (on tag push or manual tag input)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/KeyboardAnalytics-windows-x64.zip
            dist/KeyboardAnalytics.exe
